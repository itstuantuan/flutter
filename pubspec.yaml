name: bots
description: "Bots Flutter application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  android_id: ^0.6.0
  audioplayers: ^6.8.1
  crypto: ^3.0.6
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.4
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  record: ^7.2.0
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/characters/viitor_idle.png
    - assets/characters/viitor_splash.png
    - assets/splash/
    - assets/onboarding/
    - assets/home/
    - assets/design/
    - assets/chat/
    - assets/login/
    - assets/notifications/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
